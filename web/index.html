<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ark Two Simulator</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;color:#eee;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;left:10px;top:10px;font-size:13px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:6px;max-width:320px;line-height:1.4}
  #hud b{color:#f6c64a}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);cursor:pointer;font-size:20px;text-align:center}
  #toast{position:fixed;right:12px;bottom:12px;background:#2c5a2e;padding:6px 10px;border-radius:6px;display:none}
  #stick{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);display:none}
  #knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45)}
  #dbg{position:fixed;right:12px;top:12px;display:none;padding:8px 12px;font-size:14px;border:0;border-radius:6px;background:#444;color:#fff}
  #upd{position:fixed;left:50%;top:12px;transform:translateX(-50%);display:none;padding:10px 16px;font-size:15px;border:0;border-radius:8px;background:#f6c64a;color:#111;font-weight:600;z-index:10}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud"><b>Ark Two</b> · <span id="bname">walk-through</span><br>
<span id="help">W A S D move · mouse look · Shift run · R scale refs · F9 debug snapshot · Esc release mouse</span><br>
<span id="pos"></span></div>
<div id="start">Loading model…</div>
<div id="stick"><div id="knob"></div></div>
<button id="dbg">Debug</button>
<button id="upd">New version available, tap to load</button>
<div id="toast"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const MODEL = '../assets/' + (new URLSearchParams(location.search).get('build') || 'ark_two_v004') + '.glb';
const BUILD = MODEL.split('/').pop().replace('.glb','');
const WALKRE = /(Floor|Threshold)$|^Ground_Soil|^Apron|^AB_Ramp_[AB]$/, OUTDOOR = /^(Ground_Soil|Apron)/;
const EYE = 1.65, RADIUS = 0.3, WALK = 1.6, RUN = 3.2;
document.getElementById('bname').textContent = BUILD.replace('ark_two_','') + ' walk-through';
const touch = matchMedia('(pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = await fetch('../data/sky.json').then(r=>r.json()).catch(()=>null);
const C = h=>new THREE.Color(h);
const sky = SKY?.sky ?? {zenith:'#6d96c0',upper:'#7aa6cc',horizon:'#84aecf',cloud:'#b6cae1',cloud_cover:0.15};
const fog = SKY?.fog ?? {color:'#9db8cf',near_m:60,far_m:400};
scene.background = C(sky.horizon);
scene.fog = new THREE.Fog(C(fog.color), fog.near_m, fog.far_m);
const hemi=new THREE.HemisphereLight(C(sky.upper), C(SKY?.ground?.grass_shade ?? '#4c6328'), 0.6); scene.add(hemi);
let sun=null; const lamps=[];
// gradient sky dome with soft procedural clouds, colours from data/sky.json
scene.add(new THREE.Mesh(new THREE.SphereGeometry(450,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{zen:{value:C(sky.zenith)},up:{value:C(sky.upper)},hor:{value:C(sky.horizon)},cl:{value:C(sky.cloud)},cov:{value:sky.cloud_cover}},
  vertexShader:`varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 zen,up,hor,cl; uniform float cov; varying vec3 vP;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int k=0;k<5;k++){v+=a*n(p);p*=2.;a*=.5;}return v;}
    void main(){ float y=max(vP.y,0.);
      vec3 c = y<0.35 ? mix(hor,up,y/0.35) : mix(up,zen,(y-0.35)/0.65);
      if(vP.y>0.02){ vec2 uv=vP.xz/(vP.y+0.25)*1.5; float k=smoothstep(1.-cov-0.35,1.-cov+0.1,fbm(uv));
        c=mix(c,cl,k*0.8*smoothstep(0.02,0.15,vP.y)); }
      gl_FragColor=vec4(c,1.0);
      #include <colorspace_fragment>
    }`
})));
const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,1000);
camera.rotation.order='YXZ';
camera.position.set(0,EYE,9);
// ?pos=x,z,yawDeg  lets a debug snapshot be reopened at the same spot
const qp=new URLSearchParams(location.search).get('pos');

const colliders=[], scaleRefs=[], walkables=[];
let feet=0, interiorBox=null;
new GLTFLoader().load(MODEL, g=>{
  g.scene.updateMatrixWorld(true);
  const zone=g.scene.getObjectByName('Zone_Interior');
  if(zone){ interiorBox=new THREE.Box3().setFromObject(zone); zone.visible=false; }
  const spawn=g.scene.getObjectByName('Spawn_Start');
  if(spawn && !qp){ const w=new THREE.Vector3(); spawn.getWorldPosition(w); camera.position.x=w.x; camera.position.z=w.z; feet=w.y;
    const q=new THREE.Quaternion(); spawn.getWorldQuaternion(q); yaw=new THREE.Euler().setFromQuaternion(q,'YXZ').y; }
  g.scene.traverse(o=>{
    if(o.name==='Zone_Interior' || o.parent?.name==='Zone_Interior') return;
    if(o.isLight){ o.intensity = o.isDirectionalLight ? Math.min(o.intensity,3) : Math.min(o.intensity,8); if(o.isDirectionalLight){ sun=o; o.castShadow=true; o.shadow.mapSize.set(2048,2048); const sc=o.shadow.camera; sc.left=sc.bottom=-30; sc.right=sc.top=30; sc.near=0.5; sc.far=200; o.shadow.bias=-0.0005; o.shadow.normalBias=0.03; } else lamps.push(o); o.userData.base=o.intensity; }
    if(o.isMesh){
      o.castShadow=true; o.receiveShadow=true;
      if(WALKRE.test(o.name)) walkables.push(o);
      if(SKY?.ground && o.material?.name==='Grass_Mound') o.material.color.set(SKY.ground.grass_sunlit);
      if(o.name.startsWith('ScaleRef_')){ o.visible=false; scaleRefs.push(o); return; }
      if(!WALKRE.test(o.name) && !/Bulb|Sign_/.test(o.name)) colliders.push(o);
    }
  });
  scene.add(g.scene);
  if(qp){ // ?pos= has no height: stand on the lowest walkable floor under that point (interiors lie below the mound)
    g.scene.updateMatrixWorld(true);
    const rc=new THREE.Raycaster(new THREE.Vector3(camera.position.x,100,camera.position.z),new THREE.Vector3(0,-1,0));
    const hs=rc.intersectObjects(walkables,false), ind=hs.filter(h=>!OUTDOOR.test(h.object.name));
    if(ind.length) feet=ind[ind.length-1].point.y; else if(hs.length) feet=hs[0].point.y; }
  const s=document.getElementById('start');
  s.textContent = touch ? 'Tap to start' : 'Click to start walking';
}, undefined, e=>{document.getElementById('start').textContent='Could not load model: '+e.message; window.arkCheck&&window.arkCheck(true);});

// --- input
const keys={};
let yaw=0,pitch=0,started=false;
if(qp){const [x,z,yd]=qp.split(',').map(Number); camera.position.x=x; camera.position.z=z; yaw=(yd||0)/57.2958;}
const startEl=document.getElementById('start');
startEl.onclick=()=>{
  startEl.style.display='none'; started=true;
  if(touch){document.getElementById('stick').style.display='block';document.getElementById('dbg').style.display='block';
    document.getElementById('help').textContent='Left stick move · drag right side to look · Debug button for snapshot';}
  else renderer.domElement.requestPointerLock();
};
renderer.domElement.addEventListener('click',()=>{ if(started&&!touch) renderer.domElement.requestPointerLock(); });
addEventListener('mousemove',e=>{ if(document.pointerLockElement){ yaw-=e.movementX*0.0022; pitch-=e.movementY*0.0022; }});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='F9'){ e.preventDefault(); snapshot(); }
  if(e.code==='KeyR'){ scaleRefs.forEach(o=>o.visible=!o.visible); toast('Scale refs '+(scaleRefs[0]?.visible?'on':'off')); }
});
addEventListener('keyup',e=>keys[e.code]=false);

// touch: stick on left half, look on right half
let stickId=null,lookId=null,sx=0,sy=0,mx=0,my=0,lx=0,ly=0;
const knob=document.getElementById('knob');
addEventListener('touchstart',e=>{ if(!started) return;
  for(const t of e.changedTouches){
    if(t.clientX<innerWidth/2 && stickId===null){stickId=t.identifier;sx=t.clientX;sy=t.clientY;}
    else if(lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;}
  }},{passive:true});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===stickId){ mx=Math.max(-1,Math.min(1,(t.clientX-sx)/50)); my=Math.max(-1,Math.min(1,(t.clientY-sy)/50));
      knob.style.left=(40+mx*40)+'px'; knob.style.top=(40+my*40)+'px'; }
    if(t.identifier===lookId){ yaw-=(t.clientX-lx)*0.005; pitch-=(t.clientY-ly)*0.005; lx=t.clientX; ly=t.clientY; }
  }},{passive:true});
addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===stickId){stickId=null;mx=my=0;knob.style.left=knob.style.top='40px';}
    if(t.identifier===lookId) lookId=null;
  }});
document.getElementById('dbg').onclick=snapshot;

// --- movement with wall collision
const ray=new THREE.Raycaster();
function blocked(from,dir,dist){
  for(const h of [0.5,1.2]){
    ray.set(new THREE.Vector3(from.x,feet+h,from.z),dir); ray.far=dist+RADIUS;
    if(ray.intersectObjects(colliders,false).length) return true;
  }
  return false;
}
function move(dt){
  let f=0,r=0;
  if(keys.KeyW||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1;
  if(keys.KeyD||keys.ArrowRight) r+=1; if(keys.KeyA||keys.ArrowLeft) r-=1;
  f-=my; r+=mx;
  if(!f&&!r) return;
  const sp=(keys.ShiftLeft||keys.ShiftRight)?RUN:WALK;
  const fw=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)), rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const v=fw.multiplyScalar(f).add(rt.multiplyScalar(r)); if(v.length()>1) v.normalize();
  const step=sp*dt;
  // try X and Z separately so you slide along walls
  for(const axis of [new THREE.Vector3(Math.sign(v.x),0,0),new THREE.Vector3(0,0,Math.sign(v.z))]){
    const d=Math.abs(axis.x?v.x:v.z)*step; if(!d) continue;
    if(!blocked(camera.position,axis,d)) camera.position.addScaledVector(axis,d);
  }
}

// --- debug snapshot (F9)
function snapshot(){
  const p=camera.position;
  ray.setFromCamera(new THREE.Vector2(0,0),camera); ray.far=100;
  const hit=ray.intersectObjects(scene.children,true).find(h=>h.object.visible);
  const data={build:BUILD,commit:(location.pathname.split('/')[3]||'main'),time:new Date().toISOString(),ua:navigator.userAgent,
    camera:{x:+p.x.toFixed(3),y:+p.y.toFixed(3),z:+p.z.toFixed(3),yaw_deg:+(yaw*57.2958).toFixed(1),pitch_deg:+(pitch*57.2958).toFixed(1)},
    looking_at:hit?{object:hit.object.name,distance_m:+hit.distance.toFixed(2)}:null,
    note:prompt('Debug note (optional):')||''};
  const stamp=data.time.replace(/[:.]/g,'-');
  dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`ark_debug_${stamp}.json`);
  renderer.render(scene,camera);
  renderer.domElement.toBlob(b=>dl(b,`ark_debug_${stamp}.png`));
  toast('Debug snapshot saved to Downloads');
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',2500);}

// --- loop
let inside=0, onOutdoor=true;
const clock=new THREE.Clock(), posEl=document.getElementById('pos');
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  pitch=Math.max(-1.4,Math.min(1.4,pitch));
  camera.rotation.set(pitch,yaw,0);
  if(started) move(dt);
  // follow floors and ramps: highest walkable surface under the feet, up to 0.45 m step-up
  ray.set(new THREE.Vector3(camera.position.x,feet+0.45,camera.position.z),new THREE.Vector3(0,-1,0)); ray.far=3;
  const g=ray.intersectObjects(walkables,false).find(h=>h.object.visible);
  if(g){ feet += (g.point.y-feet)*Math.min(1,dt*12); onOutdoor=OUTDOOR.test(g.object.name); }
  camera.position.y=feet+EYE;
  // no shadows yet, so daylight would shine through the earth cover: fade it out once past the blast door
  const target = interiorBox ? ((interiorBox.containsPoint(camera.position) && !onOutdoor)?1:0) : THREE.MathUtils.clamp((0.6 - camera.position.z)/1.5, 0, 1);
  inside += (target-inside)*Math.min(1,dt*3);
  hemi.intensity = THREE.MathUtils.lerp(0.6, 0.1, inside);
  if(sun) sun.intensity = sun.userData.base*(1-inside);
  posEl.textContent=`x ${camera.position.x.toFixed(1)}  z ${camera.position.z.toFixed(1)}`;
  renderer.render(scene,camera);
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
<script>
// Update check: githack caches /main/ for a while, so compare against the latest commit
// and offer a commit-pinned URL (always fresh, assets load relative to it).
(function(){
  const REPO='RobertBoettcherSF/Ada-Ark-Two-Simulator';
  const seg=location.pathname.split('/');            // ['',owner,repo,ref,'web','index.html']
  const ref=seg[3]||'main', pinned=/^[0-9a-f]{40}$/.test(ref);
  const btn=document.getElementById('upd');
  const pos=document.getElementById('pos');
  async function check(force){
    try{
      const r=await fetch('https://api.github.com/repos/'+REPO+'/commits/main',{headers:{Accept:'application/vnd.github.sha'},cache:'no-store'});
      if(!r.ok) return;
      const sha=(await r.text()).trim();
      if(!/^[0-9a-f]{40}$/.test(sha)) return;
      const have=pinned?ref:localStorage.getItem('arkSha');
      if(sha!==have || (force && !pinned)){
        btn.style.display='block';
        btn.onclick=()=>{localStorage.setItem('arkSha',sha);
          location.href='https://raw.githack.com/'+REPO+'/'+sha+'/web/index.html'+location.search;};
      }
    }catch(e){}
  }
  window.arkCheck=check;
  if(location.hostname.endsWith('githack.com')){check();setInterval(check,120000);}
  const v=document.createElement('div');v.style.cssText='position:fixed;right:8px;bottom:6px;font-size:11px;opacity:.5';
  v.textContent='build '+(pinned?ref.slice(0,7):ref);document.body.appendChild(v);
})();
</script>
</body>
</html>
